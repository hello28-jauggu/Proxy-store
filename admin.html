<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ProxyVault Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a class="brand" href="/">
    Proxy<span>Vault</span> Admin
  </a>

  <a href="/">Store</a>
</header>

<main class="section">

  <h2>Admin Panel</h2>

  <p>
    Enter your admin key to manage your store.
  </p>

  <input
    id="key"
    type="password"
    placeholder="ADMIN_KEY"
  >

  <button
    class="btn primary"
    onclick="loadOrders()"
  >
    Login
  </button>

  <div id="orders" style="margin-top:25px"></div>

  <hr style="border-color:#242936;margin:45px 0">

  <h2>Products</h2>

  <div id="products"></div>

</main>

<script>

let key = "";

async function loadOrders() {

  key = document.querySelector("#key").value;

  const response = await fetch(
    "/api/admin/orders",
    {
      headers: {
        "x-admin-key": key
      }
    }
  );

  const data = await response.json();

  if (!response.ok) {

    document.querySelector("#orders").innerHTML =
      `<p class="err">${data.error}</p>`;

    return;
  }

  document.querySelector("#orders").innerHTML =
    data.reverse().map(order => `

      <div class="card" style="margin:10px 0">

        <b>${order.id}</b>

        <p>
          ${order.productName}
          · ${order.email}
          · $${order.amount}
          · ${order.status}
        </p>

        <small>
          ${order.createdAt}
        </small>

      </div>

    `).join("");

  loadProducts();
}


async function loadProducts() {

  const response =
    await fetch("/api/products");

  const products =
    await response.json();

  document.querySelector("#products").innerHTML =
    products.map(product => `

      <div class="card" style="margin:10px 0">

        <h3>
          ${product.name}
        </h3>

        <p>
          ID: ${product.id}
        </p>

        <input
          id="name-${product.id}"
          value="${product.name}"
        >

        <input
          id="price-${product.id}"
          type="number"
          value="${product.price}"
        >

        <input
          id="stock-${product.id}"
          type="number"
          value="${product.stock}"
        >

        <button
          class="btn primary"
          onclick="saveProduct('${product.id}')"
        >
          Save
        </button>

      </div>

    `).join("");
}


async function saveProduct(id) {

  const oldResponse =
    await fetch("/api/products");

  const products =
    await oldResponse.json();

  const product =
    products.find(p => p.id === id);

  product.name =
    document.querySelector("#name-" + id).value;

  product.price =
    Number(
      document.querySelector("#price-" + id).value
    );

  product.stock =
    Number(
      document.querySelector("#stock-" + id).value
    );

  const response =
    await fetch(
      "/api/admin/products",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-admin-key": key
        },

        body: JSON.stringify(product)
      }
    );

  if (response.ok) {
    alert("Product saved!");
  } else {
    alert("Failed to save product.");
  }

}

</script>

</body>
</html>
